version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: databricks_metadata_db
    environment:
      POSTGRES_DB: databricks_metadata
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d databricks_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
